<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố cục bằng Float và Clear</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="left-column">
            <h2>Cột bên trái (60%)</h2>
            <p>Đây là khu vực chứa nội dung chính của trang web. Sử dụng thuộc tính <code>float: left</code> để căn chỉnh về phía bên trái.</p>
        </div>
        
        <div class="right-column">
            <h3>Cột bên phải (38%)</h3>
            <p>Đây là khu vực sidebar. Sử dụng thuộc tính <code>float: right</code> để căn chỉnh về phía bên phải.</p>
        </div>
    </div>

</body>
</html>
